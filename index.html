<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrazeStudio</title>
<meta name="description" content="CrazeStudio is an independent studio. Browse the projects we've built.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2F2BFF;--ink:#0F0E2E;--paper:#F3F2FF;--coral:#FF6B4A;
--display:"Unbounded",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 1.0625rem/1.55 var(--body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a,button{color:inherit;font:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

.hero{min-height:100svh;background:var(--blue);color:var(--paper);display:flex;flex-direction:column;padding:clamp(1rem,3vw,2.5rem);overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.brand{font:600 .95rem var(--display)}
.gh{text-decoration:none;border-bottom:2px solid currentColor;font-weight:600}
.gh:hover{color:var(--coral)}
.hero-main{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2rem}
h1{font:800 clamp(3rem,16.5vw,15rem)/.92 var(--display);letter-spacing:-.045em}
.line{display:block;white-space:nowrap}
.l{display:inline-block;will-change:transform}
.li{display:inline-block;transition:color .25s}
.li.hot{color:var(--coral)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.hero-foot p{max-width:32ch;font-size:1.15rem}
.down{background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:.8rem 1.4rem;font-weight:600;cursor:pointer;transition:background .2s,transform .2s}
.down:hover{background:var(--coral);transform:translateY(-3px)}

.work{padding:clamp(3rem,8vw,7rem) clamp(1rem,3vw,2.5rem)}
.work-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:2.5rem}
h2{font:800 clamp(2rem,6vw,4.5rem)/1 var(--display);letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(1rem,2vw,1.75rem)}
.tile{grid-column:span 12;text-align:left;background:#fff;border:1px solid rgba(15,14,46,.14);border-radius:28px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;transition:transform .3s}
.tile:hover{transform:translateY(-6px)}
@media(min-width:800px){
.tile:nth-child(4n+1),.tile:nth-child(4n){grid-column:span 7}
.tile:nth-child(4n+2),.tile:nth-child(4n+3){grid-column:span 5}}
.art{aspect-ratio:16/9;overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.art *{transform-box:fill-box;transform-origin:center}
.t-body{padding:1.25rem 1.5rem 1.5rem;display:grid;gap:.5rem}
.t-body h3{font:600 1.5rem/1.1 var(--display);letter-spacing:-.02em}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.tags span{border:1px solid rgba(15,14,46,.3);border-radius:999px;padding:.1rem .7rem;font-size:.85rem}
.msg{grid-column:1/-1;font-size:1.1rem;max-width:60ch}

.foot{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:2rem clamp(1rem,3vw,2.5rem);background:var(--ink);color:var(--paper)}
.foot a{font-weight:600}
.foot a:hover{color:var(--coral)}

dialog{border:0;padding:0;background:transparent;max-width:min(860px,94vw);width:100%;margin:auto;overflow:visible}
dialog::backdrop{background:rgba(15,14,46,.7);backdrop-filter:blur(6px)}
.panel{background:var(--paper);border-radius:28px;overflow:hidden;max-height:92svh;overflow-y:auto}
.d-art{aspect-ratio:21/9}
.d-art svg{width:100%;height:100%;display:block}
.d-art *{transform-box:fill-box;transform-origin:center}
.d-body{padding:1.5rem 1.75rem 2rem;display:grid;gap:.9rem}
.d-body h3{font:800 clamp(1.6rem,4vw,2.5rem)/1 var(--display);letter-spacing:-.03em}
.d-tag{font-weight:600}
.d-body ul{padding-left:1.2rem;display:grid;gap:.3rem}
.d-meta{opacity:.7;font-size:.95rem}
.close{justify-self:start;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:.7rem 1.4rem;font-weight:600;cursor:pointer}
.close:hover{background:var(--coral);color:var(--ink)}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tile,.down{transition:none}}
.hero{position:relative}
.bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bg *{transform-box:fill-box;transform-origin:center}
.bar,.hero-main{position:relative;z-index:1}
.mq{background:var(--ink);color:var(--paper);overflow:hidden;padding:1.3rem 0}
.mq-track{display:flex;width:max-content;align-items:center;white-space:nowrap;font:800 clamp(2rem,6vw,4.5rem)/1 var(--display)}
.mq-track>*{margin-right:2rem}
.mq .n{color:transparent;-webkit-text-stroke:1.5px var(--paper)}
.mq svg{width:1em;height:1em;flex:none;fill:var(--coral)}
.ul{display:block;width:min(300px,60%);margin-top:.7rem;overflow:visible}
.ul path{fill:none;stroke:var(--coral);stroke-width:4;stroke-linecap:round}
#cur{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;z-index:50;display:none}
@media(pointer:fine){#cur.on{display:block}}
</style>
</head>
<body>
<section class="hero" id="top">
  <svg class="bg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path id="blob" d="M500,100 C650,80 820,200 800,330 C780,460 620,520 480,500 C340,480 200,400 220,280 C240,160 350,120 500,100 Z" fill="#0F0E2E" opacity=".45"/>
    <g fill="none" stroke="#F3F2FF" stroke-opacity=".4" stroke-width="1.5">
      <circle class="ring" cx="800" cy="170" r="90" stroke-dasharray="6 10"/>
      <circle class="ring" cx="800" cy="170" r="140" stroke-dasharray="2 12"/>
      <circle class="ring" cx="190" cy="430" r="70" stroke-dasharray="10 8"/>
    </g>
    <g fill="#FF6B4A">
      <path class="bob" d="M110 110h26v8h-26zM119 101h8v26h-8z"/>
      <polygon class="bob" points="880,430 912,484 848,484"/>
      <circle class="bob" cx="620" cy="70" r="10"/>
      <rect class="bob" x="60" y="300" width="22" height="22" rx="5"/>
    </g>
    <g class="bob">
      <rect x="712" y="102" width="200" height="124" rx="14" fill="#0F0E2E" opacity=".25"/>
      <rect x="704" y="90" width="200" height="124" rx="14" fill="#F3F2FF"/>
      <circle cx="722" cy="108" r="4.5" fill="#FF6B4A"/><circle cx="737" cy="108" r="4.5" fill="#FFC93C"/><circle cx="752" cy="108" r="4.5" fill="#5BE3B4"/>
      <rect x="720" y="128" width="84" height="66" rx="8" fill="#2F2BFF"/>
      <circle cx="762" cy="161" r="16" fill="#FF6B4A"/>
      <rect x="818" y="130" width="70" height="9" rx="4.5" fill="#0F0E2E" opacity=".25"/>
      <rect x="818" y="148" width="52" height="9" rx="4.5" fill="#0F0E2E" opacity=".25"/>
      <rect x="818" y="166" width="62" height="9" rx="4.5" fill="#0F0E2E" opacity=".25"/>
    </g>
    <g class="bob">
      <rect x="340" y="46" width="70" height="120" rx="14" fill="#F3F2FF"/>
      <rect x="348" y="62" width="54" height="64" rx="8" fill="#FF6B4A"/>
      <path d="M356 112l12-16 10 10 8-9 10 15z" fill="#F3F2FF"/>
      <rect x="348" y="134" width="34" height="7" rx="3.5" fill="#0F0E2E" opacity=".25"/>
      <rect x="370" y="152" width="20" height="5" rx="2.5" fill="#0F0E2E" opacity=".25"/>
    </g>
    <path id="flow" d="M0 585 Q 100 545 200 585 T 400 585 T 600 585 T 800 585 T 1000 585" fill="none" stroke="#F3F2FF" stroke-width="3" stroke-dasharray="12 14" stroke-linecap="round"/>
  </svg>
  <header class="bar">
    <span class="brand">CrazeStudio</span>
    <a class="gh" href="https://github.com/CrazeStudio" target="_blank" rel="noopener">GitHub.com/CrazeStudio</a>
  </header>
  <div class="hero-main">
    <h1 aria-label="CrazeStudio"><span class="line" data-split>Craze</span><span class="line" data-split>Studio</span></h1>
    <div class="hero-foot">
      <p>Independent studio. Everything we've built is below.</p>
      <button class="down" id="down" type="button">See projects</button>
    </div>
  </div>
</section>

<div class="mq" aria-hidden="true"><div class="mq-track" id="mq"></div></div>

<main class="work" id="projects">
  <div class="work-head">
    <div><h2>Projects</h2><svg class="ul" viewBox="0 0 300 16" aria-hidden="true"><path d="M2 9 Q 20 -1 38 9 T 74 9 T 110 9 T 146 9 T 182 9 T 218 9 T 254 9 T 298 9"/></svg></div>
    <p id="count" aria-live="polite"></p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <span>© <span id="yr"></span> CrazeStudio</span>
  <a href="https://github.com/CrazeStudio" target="_blank" rel="noopener">GitHub.com/CrazeStudio</a>
</footer>

<svg id="cur" viewBox="-20 -20 40 40" aria-hidden="true"><circle r="14" fill="none" stroke="#FF6B4A" stroke-width="2.5"/><circle r="2.5" fill="#FF6B4A"/></svg>

<dialog id="detail" aria-labelledby="d-name">
  <div class="panel">
    <div class="d-art" id="d-art"></div>
    <div class="d-body">
      <h3 id="d-name"></h3>
      <p class="d-tag" id="d-tag"></p>
      <p id="d-desc"></p>
      <ul id="d-list"></ul>
      <p class="d-meta" id="d-meta"></p>
      <button class="close" id="close" type="button">Close</button>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const A = window.anime;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#yr').textContent = new Date().getFullYear();
$('#down').onclick = () => $('#projects').scrollIntoView({behavior: reduce ? 'auto' : 'smooth'});

/* ---------- Hero: letters scatter in, snap into place, then dodge the pointer ---------- */
document.querySelectorAll('[data-split]').forEach(el => {
  el.innerHTML = [...el.textContent].map(c => `<span class="l" aria-hidden="true"><span class="li">${c}</span></span>`).join('');
});
const slots = [...document.querySelectorAll('.l')];

function dodge() {
  const st = slots.map(l => ({ slot: l, el: l.firstChild, x: 0, y: 0, vx: 0, vy: 0 }));
  let mx = -9999, my = -9999;
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  addEventListener('pointerleave', () => { mx = my = -9999; });
  (function tick() {
    for (const s of st) {
      const r = s.slot.getBoundingClientRect();
      const dx = r.left + r.width / 2 - mx, dy = r.top + r.height / 2 - my;
      const d = Math.hypot(dx, dy) || 1, R = 200;
      if (d < R) { const f = (1 - d / R) ** 2 * 5; s.vx += dx / d * f; s.vy += dy / d * f; }
      s.vx = (s.vx - s.x * .07) * .86; s.vy = (s.vy - s.y * .07) * .86;
      s.x += s.vx; s.y += s.vy;
      s.el.style.transform = `translate(${s.x}px,${s.y}px) rotate(${s.x * .25}deg)`;
      s.el.classList.toggle('hot', Math.hypot(s.x, s.y) > 14);
    }
    requestAnimationFrame(tick);
  })();
}

function ambient() {
  A({ targets: '#blob', d: [{ value: 'M520,140 C700,120 780,260 760,360 C740,470 600,540 460,520 C320,500 160,420 200,300 C240,180 380,160 520,140 Z' }], duration: 7000, direction: 'alternate', loop: true, easing: 'easeInOutSine' });
  A({ targets: '.ring', rotate: (_, i) => i % 2 ? '-1turn' : '1turn', duration: (_, i) => 16000 + i * 6000, easing: 'linear', loop: true });
  A({ targets: '.bob', translateY: () => A.random(-22, 22), rotate: () => A.random(-90, 90), duration: () => A.random(2200, 4200), direction: 'alternate', loop: true, easing: 'easeInOutSine' });
  A({ targets: '#flow', strokeDashoffset: [0, -260], duration: 5000, easing: 'linear', loop: true });
}
function wave() {
  A({ targets: '.l', translateY: [0, -10], duration: 1600, direction: 'alternate', loop: true, easing: 'easeInOutSine', delay: A.stagger(120) });
}
function idle(root) {
  if (!A || reduce) return;
  A({ targets: root.querySelectorAll('.fl, .wf'), translateY: [-4, 4], rotate: [-3, 3], duration: () => A.random(2400, 4000), delay: () => A.random(0, 800), direction: 'alternate', loop: true, easing: 'easeInOutSine' });
}
if (A && !reduce && matchMedia('(pointer: fine)').matches) {
  const c = $('#cur'); let x = 0, y = 0, tx = 0, ty = 0, s = 1, ts = 1;
  c.classList.add('on');
  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; });
  document.addEventListener('pointerover', e => { ts = e.target.closest('.tile, button, a') ? 2.2 : 1; });
  (function f() { x += (tx - x) * .18; y += (ty - y) * .18; s += (ts - s) * .15; c.style.transform = `translate(${x}px,${y}px) scale(${s})`; requestAnimationFrame(f); })();
}
if (A && !reduce) {
  A.set('.ul path', { strokeDashoffset: A.setDashoffset });
  new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { o.disconnect(); A({ targets: '.ul path', strokeDashoffset: 0, duration: 1400, easing: 'easeInOutSine' }); } }), { threshold: 1 }).observe($('.ul'));
}
if (A && !reduce) {
  ambient();
  A.set('.l', {
    translateX: () => A.random(-500, 500), translateY: () => A.random(-400, 400),
    rotate: () => A.random(-270, 270), scale: .2, opacity: 0
  });
  A.set(['.bar', '.hero-foot'], { opacity: 0, translateY: 16 });
  A.timeline()
    .add({ targets: '.l', translateX: 0, translateY: 0, rotate: 0, scale: 1, opacity: 1,
      duration: 1800, easing: 'easeOutElastic(1, .6)', delay: A.stagger(55, { from: 'center' }) })
    .add({ targets: ['.bar', '.hero-foot'], opacity: 1, translateY: 0, duration: 700,
      easing: 'easeOutCubic', delay: A.stagger(120) }, '-=900')
    .finished.then(() => { dodge(); wave(); });
} else if (!reduce) { dodge(); }

/* ---------- Projects ---------- */
/* Used when projects/projects.json can't be fetched (e.g. opened as a local file). */
const EMBEDDED = [
  {
    "id": "crazelauncher",
    "name": "CrazeLauncher",
    "tagline": "A launcher app from CrazeStudio.",
    "description": "Replace this text with what CrazeLauncher does and who it's for.",
    "year": "2026",
    "status": "In development",
    "tags": [
      "App"
    ],
    "accent": "#FF6B4A",
    "highlights": [
      "Add a key feature here",
      "Add another key feature here"
    ]
  },
  {
    "id": "sample-two",
    "name": "Sample Project",
    "tagline": "Placeholder. Edit projects/projects.json.",
    "description": "Each object in projects.json becomes one tile. Change the fields to describe your own project.",
    "year": "2026",
    "status": "Released",
    "tags": [
      "Web",
      "Open source"
    ],
    "accent": "#FFC93C",
    "highlights": [
      "highlights is a list of short points",
      "accent sets the tile color"
    ]
  },
  {
    "id": "sample-three",
    "name": "Another Sample",
    "tagline": "Add as many projects as you like.",
    "description": "Tiles lay out automatically and animate in as they scroll into view.",
    "year": "2025",
    "status": "Archived",
    "tags": [
      "Tool"
    ],
    "accent": "#5BE3B4",
    "highlights": [
      "No code changes needed to add a project"
    ]
  }
];
function rng(seed) {
  let h = 1779033703 ^ seed.length;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 3432918353), h = h << 13 | h >>> 19;
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
let uid = 0;
function art(p) {
  const r = rng(p.id || p.name), id = 'c' + (++uid), cols = ['#0F0E2E', '#F3F2FF', '#FFFFFF'], ac = esc(p.accent || '#FF6B4A');
  let s = '';
  for (let i = 0; i < 6; i++) {
    const x = 8 + r() * 84, y = 8 + r() * 34, z = 5 + r() * 12, c = cols[i % 3], k = i % 3;
    s += k === 0 ? `<circle cx="${x}" cy="${y}" r="${z}" fill="${c}"/>`
      : k === 1 ? `<rect x="${x - z}" y="${y - z}" width="${z * 2}" height="${z * 1.4}" rx="3" fill="${c}"/>`
      : `<circle cx="${x}" cy="${y}" r="${z}" fill="none" stroke="${c}" stroke-width="2.5"/>`;
  }
  const w = r() * 8;
  const body = p.image
    ? `<image href="${esc(p.image)}" x="12" y="14" width="76" height="30" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/>`
    : `<rect x="17" y="19" width="30" height="20" rx="2" fill="${ac}"/><rect x="52" y="20" width="${20 + w}" height="3" rx="1.5" fill="#0F0E2E" opacity=".25"/><rect x="52" y="26" width="${18 + w}" height="3" rx="1.5" fill="#0F0E2E" opacity=".25"/><polyline points="52,39 58,35 64,37 70,32 ${78 + w / 2},34" fill="none" stroke="#0F0E2E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 100 50" preserveAspectRatio="xMidYMid slice" style="background:${ac}" aria-hidden="true"><defs><clipPath id="${id}"><rect x="12" y="6" width="76" height="38" rx="3.5"/></clipPath></defs><g class="fl">${s}</g><g class="wf"><g class="win"><rect x="14" y="10.5" width="76" height="36" rx="3.5" fill="#0F0E2E" opacity=".22"/><rect x="12" y="8" width="76" height="36" rx="3.5" fill="#fff"/>${body}<path d="M12 14V11.5A3.5 3.5 0 0 1 15.5 8H84.5A3.5 3.5 0 0 1 88 11.5V14Z" fill="#fff"/><circle cx="17" cy="11" r="1.1" fill="#FF6B4A"/><circle cx="21.5" cy="11" r="1.1" fill="#FFC93C"/><circle cx="26" cy="11" r="1.1" fill="#5BE3B4"/></g></g><path class="draw" d="M4 47.5 Q16 44.5 28 47.5 T52 47.5 T76 47.5 T100 47.5" fill="none" stroke="#0F0E2E" stroke-width="1.4" stroke-linecap="round"/></svg>`;
}
function play(root, on) {
  if (!A || reduce) return;
  A({ targets: root.querySelectorAll('.fl > *'), duration: 900, easing: 'easeOutElastic(1, .7)',
    rotate: () => on ? A.random(-90, 90) : 0, translateX: () => on ? A.random(-10, 10) : 0,
    translateY: () => on ? A.random(-6, 6) : 0, scale: () => on ? A.random(8, 14) / 10 : 1 });
  A({ targets: root.querySelectorAll('.win'), scale: on ? 1.04 : 1, rotate: on ? -1.5 : 0, duration: 700, easing: 'easeOutElastic(1, .7)' });
}

fetch('projects/projects.json').then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() => EMBEDDED).then(list => {
  const grid = $('#grid');
  const star = '<svg viewBox="0 0 24 24" class="star"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg>';
  const row = list.map(p => `<span class="n">${esc(p.name)}</span>${star}`).join('');
  $('#mq').innerHTML = row + row + row + row;
  if (A && !reduce) {
    A({ targets: '#mq', translateX: ['0%', '-50%'], duration: 24000, easing: 'linear', loop: true });
    A({ targets: '.star', rotate: '1turn', duration: 4000, easing: 'linear', loop: true });
  }
  $('#count').textContent = `${list.length} project${list.length === 1 ? '' : 's'}`;
  grid.innerHTML = list.map((p, i) => `
    <button class="tile" data-i="${i}" type="button" aria-label="Open ${esc(p.name)}">
      <div class="art">${art(p)}</div>
      <div class="t-body"><h3>${esc(p.name)}</h3><p>${esc(p.tagline)}</p>
      <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div></div>
    </button>`).join('');
  const tiles = [...grid.children];
  tiles.forEach(t => {
    t.addEventListener('pointerenter', () => play($('.art', t), true));
    t.addEventListener('pointerleave', () => play($('.art', t), false));
    t.addEventListener('click', () => open(list[t.dataset.i]));
  });
  if (A && !reduce) {
    tiles.forEach(t => t.style.clipPath = 'inset(100% 0 0 0)');
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      A({ targets: e.target, clipPath: ['inset(100% 0 0 0)', 'inset(0% 0 0 0)'], duration: 900, easing: 'easeOutExpo' });
      A({ targets: $('.art svg', e.target), scale: [1.35, 1], duration: 1200, easing: 'easeOutExpo' });
      A({ targets: $('.draw', e.target), strokeDashoffset: [A.setDashoffset, 0], duration: 1400, delay: 500, easing: 'easeInOutSine' });
      idle(e.target);
    }), { threshold: .15 });
    tiles.forEach(t => io.observe(t));
  }
}).catch(() => {
  $('#grid').innerHTML = '<p class="msg">Couldn\'t load projects/projects.json. If you opened index.html directly, serve the folder over http instead (for example, run "npx serve" in it).</p>';
});

/* ---------- Detail dialog ---------- */
const dlg = $('#detail');
function open(p) {
  $('#d-art').innerHTML = art(p);
  $('#d-name').textContent = p.name;
  $('#d-tag').textContent = p.tagline || '';
  $('#d-desc').textContent = p.description || '';
  $('#d-list').innerHTML = (p.highlights || []).map(h => `<li>${esc(h)}</li>`).join('');
  $('#d-meta').textContent = [p.year, p.status, ...(p.tags || [])].filter(Boolean).join(', ');
  dlg.showModal();
  if (A && !reduce) {
    A({ targets: '.panel', translateY: [60, 0], opacity: [0, 1], duration: 600, easing: 'easeOutExpo' });
    A({ targets: '.d-body > *', translateY: [20, 0], opacity: [0, 1], delay: A.stagger(60, { start: 150 }), duration: 600, easing: 'easeOutCubic' });
    play($('#d-art'), true);
    idle($('#d-art'));
    A({ targets: $('#d-art .draw'), strokeDashoffset: [A.setDashoffset, 0], duration: 1200, delay: 300, easing: 'easeInOutSine' });
  }
}
function close() {
  if (A && !reduce) A({ targets: '.panel', translateY: 40, opacity: 0, duration: 250, easing: 'easeInCubic', complete: () => dlg.close() });
  else dlg.close();
}
$('#close').onclick = close;
dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
})();
</script>
</body>
</html>
